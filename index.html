<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f97316" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- MERIDIAN type system: Bricolage Grotesque (display) · Nunito Sans (body) · JetBrains Mono (data) -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Nunito+Sans:ital,opsz,wght@0,6..12,300;0,6..12,400;0,6..12,500;0,6..12,600;0,6..12,700;1,6..12,400&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <title>MLPHoma — NATA LABA Construction Suite</title>
  <script>
    (function () {
      try {
        var localTheme = localStorage.getItem('theme');
        var supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches === true;
        if (localTheme === 'dark' || (!localTheme && supportDarkMode)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script>
    // Chunk-load error recovery: catches stale-SW scenarios BEFORE bundled code runs.
    // If a module script 404s (SW served old index.html with old chunk hashes),
    // unregister all service workers and hard-reload once to get fresh index.html.
    (function () {
      var KEY = '__chunkReload';
      window.addEventListener('error', function (e) {
        var msg = e.message || '';
        if (
          msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
          msg.indexOf('Importing a module script failed') !== -1 ||
          msg.indexOf('Loading chunk') !== -1 ||
          msg.indexOf('Loading CSS chunk') !== -1
        ) {
          if (!sessionStorage.getItem(KEY)) {
            sessionStorage.setItem(KEY, '1');
            // Unregister all service workers so next load gets fresh HTML
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
                // Also clear all caches
                if ('caches' in window) {
                  caches.keys().then(function (names) {
                    names.forEach(function (name) { caches.delete(name); });
                  });
                }
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }
        }
      }, true);
      // Clear the reload flag on successful page load (chunks loaded fine)
      window.addEventListener('load', function () {
        sessionStorage.removeItem(KEY);
      });
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
